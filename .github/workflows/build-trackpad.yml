name: Build Amethyst Samsung Trackpad Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sorgenti e submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v4

      - name: Applica correzione trackpad
        run: python3 apply_trackpad_fix.py .

      - name: Compila APK di debug
        run: |
          chmod +x ./gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Pubblica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-s8-ultra-debug-apk
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
